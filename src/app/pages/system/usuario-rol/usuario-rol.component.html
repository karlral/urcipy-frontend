<p-toast></p-toast>

<p-table #dt [value]="usuarioRoles" [rows]="10" [paginator]="true" [globalFilterFields]="['usuario.username','rol.nombre']"
    [tableStyle]="{'min-width': '50rem'}" [rowHover]="true" dataKey="idusuarioRol"
    currentPageReportTemplate="Mostrar {first} a {last} de {totalRecords} totales" [showCurrentPageReport]="true"
    >

    <ng-template pTemplate="caption">
        <div class="flex align-items-center justify-content-between">
            <button pButton pRipple icon="pi pi-plus" class="p-button-success mr-2" (click)="showModal()"></button>
            <h2 class="m-0">UsuarioRols</h2>
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Buscar..." />
            </span>
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            
            <th pSortableColumn="usuario.usuario" style="min-width:15rem">Usuario <p-sortIcon field="usuario.usuario"></p-sortIcon></th>
            <th>Roles</th>
            

            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-usuarioRol>
        <tr>
            <td>{{usuarioRol.usuario.username }} </td>
            <td>{{usuarioRol.rol.nombre}}</td>
            
            <td>
                <button  pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                (click)="editUsuarioRol(usuarioRol)"></button>
                <button  pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                    (click)="deleteUsuarioRol(usuarioRol)"></button> 
            </td>
        </tr>
    </ng-template>
    
</p-table>

 <app-add-edit-usuario-rol 
    [displayAddEditModal]="displayAddEditModal"
    [selectedUsuarioRol]="selectedUsuarioRol"
    [usuarios]="usuarios"
    [roles]="roles"
    (clickClose)="hideModal($event)"
    (clickAddEdit)="saveUsuarioRolToList($event)"
></app-add-edit-usuario-rol> 

<p-confirmDialog header="Borrar" [style]="{width: '50vw'}" icon="pi pi-exclamation-triangle"></p-confirmDialog>
