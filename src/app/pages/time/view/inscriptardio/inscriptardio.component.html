<section class="content">
    <div class="block-content">
        <h3 class="heading">Inscripcion Tardia y Pagos</h3>
        <div class="row">
            
            <div *ngFor="let evento of eventoes" >
                <div class="card">
                    <div class="face front">
                        <h1 class="onetop">Fecha {{evento.fecha | date: 'dd/MM/yyyy' :'UTC'}}</h1>
                        
                        <img [src]="mediaLocation+evento.club.rutagrande" [alt]="evento.club.rutagrande" />
                        
                        <div class="botones">
                           <button type="submit"  [routerLink]="['/portfolio/eventobus',evento.idevento]" class="btn inscrip nav-btn">INSCRIBETE</button>

                            <!--  {label: 'Lista Inscriptos Evento 1', icon: 'pi pi-list-check', routerLink: ['/time/access/listpart/1']}, -->
                            <button type="submit"  [routerLink]="['/time/access/listpart',evento.activo]" class="btn list nav-btn">LISTA DE INSCRIPTOS</button> 
                            
                        </div>
                    </div>
                </div>
            </div>    
        </div>
    </div>
</section>
