<p-toast></p-toast>

<p-table #dt [value]="tipopuntoses" [rows]="10" [paginator]="true" [globalFilterFields]="['nomtipopuntos']" 
    [tableStyle]="{'min-width': '50rem'}" [rowHover]="true" dataKey="idtipopuntos"
    currentPageReportTemplate="Mostrar {first} a {last} de {totalRecords} totales" [showCurrentPageReport]="true"
    >

    <ng-template pTemplate="caption">
        <div class="flex align-items-center justify-content-between">
            <button pButton pRipple icon="pi pi-plus" class="p-button-success mr-2" (click)="showModal()"></button>
            <h2 class="m-0">Tipos</h2>
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar..." />
            </span>
            
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            
            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tipopuntos>
        <tr>

            <td class="centro">{{tipopuntos.idtipopuntos}}</td>
            <td class="centro">{{tipopuntos.nomtipopuntos}}</td>
            
            
            <td>
                 <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                    (click)="editTipo(tipopuntos)"></button>
                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                    (click)="deleteTipo(tipopuntos)"></button> 
            </td>
        </tr>
    </ng-template>
</p-table>

 <app-add-edit-tipopuntos 
    [displayAddEditModal]="displayAddEditModal"
    [selectedTipopuntos]="selectedTipopuntos"
    (clickClose)="hideModal($event)"
    (clickAddEdit)="saveTipoToList($event)"
></app-add-edit-tipopuntos> 

<p-confirmDialog header="Borrar" [style]="{width: '50vw'}" icon="pi pi-exclamation-triangle"></p-confirmDialog>
