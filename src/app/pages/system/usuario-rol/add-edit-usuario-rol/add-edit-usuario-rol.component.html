<p-dialog header="Header" [(visible)]="displayAddEditModal" [modal]="true" [style]="{width: '400px' }"
    (onHide)="closeModal()">

    <ng-template pTemplate="header">
        <span class="text-xl font-bold">{{modalType}}</span>
    </ng-template>

    
    <form [formGroup]="usuarioRolForm" class="usuarioRol-form">


        
        <div class="field">
            <label for="rol">Rol</label>
            <p-dropdown [options]="roles" formControlName="rol"  placeholder="Seleccionar un rol" 
            autoWidth="false" [filter]="true" [filterBy]="'nombre'" 
                [style]="{'width':'100%'}" optionLabel="nombre" [showClear]="true" appendTo="body"></p-dropdown>
        </div>
        
        <fieldset formGroupName="usuario" class="mr-2">
            <div class="field flex align-items-center justify-content-evenly flex-wrap">
                    <label for="enabled" class="mr-2">Activar</label>
                    <p-inputSwitch id="enabled" formControlName="enabled"></p-inputSwitch>
            </div>
        </fieldset>
        
        
    </form>

    <ng-template pTemplate="footer">
        <p-button icon="pi pi-cancel" (click)="closeModal()" label="Cancel" styleClass="p-button-text"></p-button>
        <p-button icon="pi pi-add" (click)="addEditUsuarioRol()" label="{{modalType}}" styleClass="p-button-text"
            [disabled]="usuarioRolForm.invalid"></p-button>
    </ng-template>

</p-dialog>
