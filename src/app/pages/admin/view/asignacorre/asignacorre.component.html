<p-toast></p-toast>

<p-table  #dt [value]="inscriptos" [rows]="10" [paginator]="true" [globalFilterFields]="['corredor', 'ci', 'club', 'categoria']"
    [tableStyle]="{'min-width': '50rem'}" [rowHover]="true" dataKey="id"
    currentPageReportTemplate="Mostrar {first} a {last} de {totalRecords} totales" [showCurrentPageReport]="true"
    >

    <ng-template pTemplate="caption">
        <div class="flex align-items-center justify-content-between">
            <button type="button"
                pButton pRipple
                icon="pi pi-file-excel"
                (click)="exportExcel2()"
                class="p-button-outlined p-button-success"
                class="p-button-success "
                pTooltip="XLS"
                label="Export"
                tooltipPosition="bottom">
            </button>
    
            <h2 class="m-0">Corredores Inscriptos</h2>
            
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Buscar..." />
            </span>
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th>ID</th>
            <th>C.I.</th>
            <th pSortableColumn="corredor" style="min-width:15rem">Corredor <p-sortIcon field="corredor"></p-sortIcon></th>
            <th>Club</th>
            <th>Categoria</th>
            <th>Puesto Cat.</th>
            <th>Puntaje</th>
            <th>Puntua</th>
            <th>Puntaje Aux.</th>
            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-partici>
        <tr>
            <td>{{partici.id}}</td>
            <td>{{partici.ci}}</td>
            <td>{{partici.corredor}}</td>
            <td>{{partici.club}}</td>
            <td>{{partici.categoria}}</td>
            <td>{{partici.puestocat}}</td>
            <td>{{partici.puntaje}}</td>
            <td>{{partici.puntua==1?"Sí":"No"}}</td>
            <td>{{partici.puntajeaux}}</td>
            
            <td>
                
                <button  pButton pRipple icon="pi pi-money-bill" class="p-button-rounded p-button-info mr-2"
                    (click)="addAsigna(partici)"></button>
              
           </td>
        </tr>
    </ng-template>
</p-table>

 <app-add-asigna
    [displayAddModal]="displayAddModal"
    [selectedInscripto]="selectedInscripto"

    (clickClose)="hideModal($event)"
    (clickAdd)="updateCorredorToList($event)"
></app-add-asigna>

<p-confirmDialog header="Borrar" [style]="{width: '50vw'}" icon="pi pi-exclamation-triangle"></p-confirmDialog>
