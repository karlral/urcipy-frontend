<p-dialog header="Header" [(visible)]="displayAddEditModal" [modal]="true" [style]="{width: '400px' }"
    (onHide)="closeModal()">

    <ng-template pTemplate="header">
        <span class="text-xl font-bold">{{modalType}} EventoRemera</span>
    </ng-template>

    
    <form [formGroup]="eventoRemeraForm" class="eventoRemera-form">

        
        

        <div class="field">
            <label for="evento">Evento</label>
            <p-dropdown [options]="eventos" formControlName="evento"  placeholder="Seleccionar un evento" autoWidth="false"
            [filter]="true" [filterBy]="'nomevento'" 
                [style]="{'width':'100%'}" optionLabel="nomevento" [showClear]="true" appendTo="body"></p-dropdown>
        </div>
        
        <div class="field">
            <label for="remera">Tamaños Remeras</label>
            <p-dropdown [options]="remeras" formControlName="remera"  placeholder="Seleccionar un remera" autoWidth="false"
            [filter]="true" [filterBy]="'nomremera'" 
                [style]="{'width':'100%'}" optionLabel="nomremera" [showClear]="true" appendTo="body"></p-dropdown>
        </div>
        
        
    </form>

    <ng-template pTemplate="footer">
        <p-button icon="pi pi-cancel" (click)="closeModal()" label="Cancel" styleClass="p-button-text"></p-button>
        <p-button icon="pi pi-add" (click)="addEditEventoRemera()" label="{{modalType}}" styleClass="p-button-text"
            [disabled]="eventoRemeraForm.invalid"></p-button>
    </ng-template>

</p-dialog>
