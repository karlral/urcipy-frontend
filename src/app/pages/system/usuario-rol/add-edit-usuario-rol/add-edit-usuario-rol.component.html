<p-dialog header="Header" [(visible)]="displayAddEditModal" [modal]="true" [style]="{width: '400px' }"
    (onHide)="closeModal()">

    <ng-template pTemplate="header">
        <span class="text-xl font-bold">{{modalType}} UsuarioRol</span>
    </ng-template>

    
    <form [formGroup]="usuarioRolForm" class="usuarioRol-form">

        
        

        <div class="field">
            <label for="usuario">Usuario</label>
            <p-dropdown [options]="usuarios" formControlName="usuario"  placeholder="Seleccionar un usuario" autoWidth="false"
            [filter]="true" [filterBy]="'username'" 
                [style]="{'width':'100%'}" optionLabel="username" [showClear]="true" appendTo="body"></p-dropdown>
        </div>
        
        <div class="field">
            <label for="rol">Roles</label>
            <p-dropdown [options]="roles" formControlName="rol"  placeholder="Seleccionar un rol" autoWidth="false"
            [filter]="true" [filterBy]="'nomrol'" 
                [style]="{'width':'100%'}" optionLabel="nomrol" [showClear]="true" appendTo="body"></p-dropdown>
        </div>
        
        
    </form>

    <ng-template pTemplate="footer">
        <p-button icon="pi pi-cancel" (click)="closeModal()" label="Cancel" styleClass="p-button-text"></p-button>
        <p-button icon="pi pi-add" (click)="addEditUsuarioRol()" label="{{modalType}}" styleClass="p-button-text"
            [disabled]="usuarioRolForm.invalid"></p-button>
    </ng-template>

</p-dialog>
