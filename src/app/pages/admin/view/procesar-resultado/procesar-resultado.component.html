<p-toast></p-toast>
<p-dialog [(visible)]="eventoDialog"  header="Cargar Historial" [modal]="true" styleClass="p-fluid">
    <ng-template pTemplate="content">

        <div class="field">
            <label for="pais">PROCESAR RESULTADOS</label>

    
        </div>
        <div class="field">
            <label for="fondo" class="form-label">Seleccionar fondo</label>
            <input id="fondo" name="fondo"  class="form-control"
                accept="text/csv" type="file" (change)="selectFile($event)">
                <input type="hidden" name="oculto" formControlName="fondo"/>
                <p *ngIf="fileName" class="pl-4 align-middle mb-0">{{fileName}}</p>
        </div>

        <p-table [value]="resultimios" *ngIf="displayTable">
            <ng-template pTemplate="header">
                <tr>
                    <th>ID</th>
                    <th>Nombre Participante</th>
                    <th>POS</th>
                    <th>TIEMPO</th>
                    <th>Dosal</th>
                    <th>CI</th>
                    <th>KM</th>
                    <th>Categoria</th>
                    <th>Club</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData>
                <tr>
                    <td>{{rowData.idevento}}</td>
                    <td>{{rowData.nomparticipante}}</td>
                    <td>{{rowData.poscategoria}}</td>
                    <td>{{rowData.tiempos}}</td>
                    <td>{{rowData.dosal}}</td>
                    <td>{{rowData.ci}}</td>
                    <td>{{rowData.distancia}}</td>
                    <td>{{rowData.categoria}}</td>
                    <td>{{rowData.club}}</td>
                </tr>
            </ng-template> 
        </p-table>

    </ng-template>

    <ng-template pTemplate="footer">
       <button *ngIf="displayTable" pButton pRipple label="Inscribir Todos" icon="pi pi-check" class="p-button-text" (click)="inscribirTodos()"></button>
        <button *ngIf="displayTable" pButton pRipple label="Procesar Resultados" icon="pi pi-check" class="p-button-text" (click)="procesarResultados()"></button>
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
