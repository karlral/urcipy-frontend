
<div class="hero">
    <div class="blur hero-blur"></div>
    <div class="left-h">
        <app-header></app-header>
        <img src="assets/images/logo.png" alt="" class='logo' />
        <!-- {/* El mejor best ad */} -->

        <div class="the-best-ad">

            <div class="the-best-ad-1"></div>
            <span>Cronometra con precision el tiempo de llegada...</span>
        </div>
        <!-- {/* Hero Heading */} -->
        <div class="hero-text">
            <div>
                <span class="stroke-text">CRONOSTAR</span>
            </div>
            <div>
                <span>TUS TIEMPOS</span>
            </div>
            <div>
                <span>
                    Aqui nosotros te ayudamos a llevar un control de tus tiempos de
                    llegada y salida
                </span>
            </div>
        </div>
        <!-- {/* Hero Button */} -->
        <div class="figures">
            <div>
                <span>
                    <!-- <NumberCounter end={4} start={0} delay={4} preFix="+"></NumberCounter> -->
                     +4
                </span>
                <span>Campeonatos</span>
            </div>
            <div>
                <span>
                    <!-- <NumberCounter end={20} start={0} delay={4} preFix="+"></NumberCounter> -->
                     +20
                </span>
                <span>Eventos</span>
            </div>
            <div>
                <span>
                    <!-- <NumberCounter end={1000} start={500} delay={5} preFix="+"></NumberCounter> -->
                     +1000
                </span>
                <span>Corredores</span>
            </div>

        </div>
        <!-- {/* Hero Buttons */} -->
        <!--div  class="hero-buttons">
            <button class="btn" [routerLink]="['/portfolio']">Inscripciones</button>
            <button *ngFor="let evento of eventoes" class="btn" role="link"
                (click)="openInNewTab('https://live.cronostar.com/g-live/g-live.html?f=./resultado/2025/'+evento.idevento+'/'+evento.fondocolor)">Ver
                Resulados {{evento.nomevento | uppercase}}</button>
            
        </div-->
    </div>

    <!--div *ngIf="event" class="right-h"-->
    <div  class="right-h">
    

        <!--div 
            class="heart-rate">
            <img src="../../../../assets/images/heart.png" alt="heart" />
            <span>Heart Rate</span>
            <span>170 bpm</span>
        </div-->
        <!-- {/* Imagen de hero */} -->
        <!-- <img src="../../../../assets/images/hero_image.png" class="hero-image" alt="hero" /> -->
        <div  *ngFor="let evento of eventoes" class="hero-image-container">
            
            <a  *ngIf="evento.preinscrip==1 && evento.modalidad.idmodalidad==1" [routerLink]="['/portfolio/eventobus',evento.idevento]"><img  [src]="mediaLocation+evento.fondo" class="hero-image2" [alt]="evento.fondo" /></a>    
            <a  *ngIf="evento.preinscrip==1 && evento.modalidad.idmodalidad==2" [routerLink]="['/portfolio/eventobusrun',evento.idevento]"><img  [src]="mediaLocation+evento.fondo" class="hero-image2" [alt]="evento.fondo" /></a> 

            <img *ngIf="evento.preinscrip==2 || evento.preinscrip==3 || evento.preinscrip==5" [src]="mediaLocation+evento.fondo" class="hero-image2" [alt]="evento.fondo" />   
            

            <a  *ngIf="evento.preinscrip==4 && evento.modalidad.idmodalidad==1" [routerLink]="['/portfolio/eventobus',evento.idevento]"><img  [src]="mediaLocation+evento.fondo" class="hero-image2" [alt]="evento.fondo" /></a>    
            <a  *ngIf="evento.preinscrip==4 && evento.modalidad.idmodalidad==2" [routerLink]="['/portfolio/eventobusrun',evento.idevento]"><img  [src]="mediaLocation+evento.fondo" class="hero-image2" [alt]="evento.fondo" /></a> 
            
            <div  class="hero-buttons">
                <button class="btn" *ngIf="evento.preinscrip==1 && evento.modalidad.idmodalidad==1" [routerLink]="['/portfolio/eventobus',evento.idevento]">Inscripcion {{evento.nomevento | uppercase}}</button>    
                <button class="btn" *ngIf="evento.preinscrip==1 && evento.modalidad.idmodalidad==2" [routerLink]="['/portfolio/eventobusrun',evento.idevento]">Inscripcion {{evento.nomevento | uppercase}}</button> 

                <button class="btn" type="submit" *ngIf="(evento.preinscrip==1  || evento.preinscrip==2 || evento.preinscrip==3)  && evento.modalidad.idmodalidad==1" [routerLink]="['/portfolio/inscripciones',evento.activo]" class="btn list nav-btn">Lista de Inscriptos</button> 
                <button class="btn" type="submit" *ngIf="(evento.preinscrip==1  || evento.preinscrip==2 || evento.preinscrip==3)  && evento.modalidad.idmodalidad==2" [routerLink]="['/portfolio/inscripcionesrun',evento.activo]" class="btn list nav-btn">Lista de Inscriptos</button> 

                <button class="btn" *ngIf="evento.preinscrip==4 && evento.modalidad.idmodalidad==1" [routerLink]="['/portfolio/eventobus',evento.idevento]">Inscripcion {{evento.nomevento | uppercase}}</button>    
                <button class="btn" *ngIf="evento.preinscrip==4 && evento.modalidad.idmodalidad==2" [routerLink]="['/portfolio/eventobusrun',evento.idevento]">Inscripcion {{evento.nomevento | uppercase}}</button> 
                   
                <button *ngIf="evento.preinscrip==5" class="btn" role="link"
                (click)="openInNewTab('https://live.cronostar.com/g-live/g-live.html?f=./resultado/2025/'+evento.idevento+'/'+evento.fondocolor)">Ver
                Resulados {{evento.nomevento | uppercase}}</button>
            </div>
        
        </div>
        
            
        <img 
            src="../../../../assets/images/hero_image_back.png" class="hero-image-back" alt="hero back" />
    </div>

</div>
