<p-dialog header="Header" [(visible)]="displayAddEditModal" [modal]="true" [style]="{width: '400px' }"
    (onHide)="closeModal()">
    <ng-template pTemplate="header">
        <span class="text-xl font-bold">{{modalType}} Remera</span>
    </ng-template>
    <form [formGroup]="remeraForm" class="remera-form">

                
        <div class="field flex align-items-center justify-content-evenly flex-wrap">
            <label for="nomremera">Tamaño Remera</label>
            <input type="text" pInputText id="nomremera" formControlName="nomremera"  required 
                placeholder="Tamaño" class="prime"
                [style]="{'width':'100%'}"  />
            <small class="p-error" *ngIf="
                        remeraForm.controls['nomremera'].invalid && 
                        remeraForm.controls['nomremera'].dirty">La remera es
                        requerido.</small>
        </div>

       


    </form>



    <ng-template pTemplate="footer">
        <p-button icon="pi pi-cancel" (click)="closeModal()" label="Cancel" styleClass="p-button-text"></p-button>
        
        <p-button icon="pi pi-add" (click)="addEditRemera()" label="{{modalType}}" styleClass="p-button-text"
            [disabled]="remeraForm.invalid"></p-button>


    </ng-template>

</p-dialog>
