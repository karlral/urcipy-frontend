<p-dialog header="Header" [(visible)]="displayAddEditModal" [modal]="true" [style]="{width: '400px' }"
    (onHide)="closeModal()">
    <ng-template pTemplate="header">
        <span class="text-xl font-bold">{{modalType}} Tipo</span>
    </ng-template>
    <form [formGroup]="tipopuntosForm" class="tipopuntos-form">

                
        <div class="field flex align-items-center justify-content-evenly flex-wrap">
            <label for="nomtipopuntos">Tipo de Puntuacion</label>
            <input type="text" pInputText id="nomtipopuntos" formControlName="nomtipopuntos"  required 
                placeholder="Tipo" class="prime"
                [style]="{'width':'100%'}"  />
            <small class="p-error" *ngIf="
                        tipopuntosForm.controls['nomtipopuntos'].invalid && 
                        tipopuntosForm.controls['nomtipopuntos'].dirty">La tipopuntos es
                        requerido.</small>
        </div>

       


    </form>



    <ng-template pTemplate="footer">
        <p-button icon="pi pi-cancel" (click)="closeModal()" label="Cancel" styleClass="p-button-text"></p-button>
        
        <p-button icon="pi pi-add" (click)="addEditTipo()" label="{{modalType}}" styleClass="p-button-text"
            [disabled]="tipopuntosForm.invalid"></p-button>


    </ng-template>

</p-dialog>
